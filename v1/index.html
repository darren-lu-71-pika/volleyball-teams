<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>排球自動分隊</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--ac:#2563eb;--m:#dbeafe;--mt:#1e40af;--w:#fce7f3;--wt:#9d174d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1a1f26;--tx:#e8eaed;--mu:#9aa3af;--bd:#2c333c;--ac:#60a5fa;--m:#1e3a5f;--mt:#bfdbfe;--w:#5b2145;--wt:#fbcfe8}}
:root[data-theme="dark"]{--bg:#111418;--card:#1a1f26;--tx:#e8eaed;--mu:#9aa3af;--bd:#2c333c;--ac:#60a5fa;--m:#1e3a5f;--mt:#bfdbfe;--w:#5b2145;--wt:#fbcfe8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
textarea,select,input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
textarea{min-height:190px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row select{flex:1;min-width:110px;width:auto}
button{font:inherit;border:0;border-radius:8px;padding:9px 16px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}
.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);border-radius:99px;padding:3px 6px 3px 12px;margin:6px 6px 0 0;font-size:14px}
.pill button{padding:0 8px;background:none;color:var(--mu);font-size:18px}
.teams{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.team{border:1px solid var(--bd);border-radius:10px;padding:10px}
.team h3{margin:0 0 6px;font-size:15px}
.p{display:inline-block;border-radius:6px;padding:2px 9px;margin:3px 4px 0 0;font-size:15px}
.p.m{background:var(--m);color:var(--mt)}.p.w{background:var(--w);color:var(--wt)}
.mu{color:var(--mu);font-size:14px}
.msg{color:#dc2626;font-size:14px;margin-top:8px}
.vs{margin-top:8px;font-size:14px;color:var(--mu)}
</style>
</head>
<body>
<main>
<h1>🏐 排球自動分隊</h1>

<div class="card">
<h2>1. 名單（一行一個名字）</h2>
<div class="grid">
<div><div class="mu">男生</div><textarea id="men"></textarea></div>
<div><div class="mu">女生</div><textarea id="women"></textarea></div>
</div>
<div class="row" style="margin-top:10px">
<span class="mu">每隊男生</span><input id="pm" type="number" min="1" value="3" style="width:70px">
<span class="mu">每隊女生</span><input id="pw" type="number" min="1" value="3" style="width:70px">
</div>
</div>

<div class="card">
<h2>2. 綁定同隊（情侶、夫妻）</h2>
<div class="row"><select id="a"></select><span>＋</span><select id="b"></select><button id="add">綁定</button></div>
<div id="pairs"></div>
<div class="msg" id="pmsg"></div>
</div>

<div class="card">
<div class="row">
<button id="go">開始分隊</button>
<button class="g" id="clear">清除紀錄</button>
<span class="mu" id="info"></span>
</div>
<div class="msg" id="err"></div>
</div>

<div id="out"></div>
</main>

<script>
var KEY="vb-teams-v1",NAMES=["紅隊","藍隊","綠隊","黃隊","紫隊","橘隊"];
var $=function(i){return document.getElementById(i)};
var S={men:"",women:"",pairs:[],rounds:[]};
try{var r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!S.men){S.men=[1,2,3,4,5,6,7,8,9].map(function(i){return"男"+i}).join("\n");S.women=[1,2,3,4,5,6,7,8,9].map(function(i){return"女"+i}).join("\n")}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function list(t){var seen={};return t.split("\n").map(function(s){return s.trim()}).filter(function(s){if(!s||seen[s])return false;seen[s]=1;return true})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function gender(n){return list($("men").value).indexOf(n)>=0?"m":"w"}

function fillSel(){
  var all=list($("men").value).concat(list($("women").value));
  ["a","b"].forEach(function(id,k){
    var el=$(id),v=el.value;
    el.innerHTML=all.map(function(n){return"<option>"+esc(n)+"</option>"}).join("");
    if(all.indexOf(v)>=0)el.value=v;else if(k==1&&all.length>1)el.value=all[1];
  });
  S.pairs=S.pairs.filter(function(p){return all.indexOf(p[0])>=0&&all.indexOf(p[1])>=0});
  drawPairs();
}
function drawPairs(){
  $("pairs").innerHTML=S.pairs.map(function(p,i){return'<span class="pill">'+esc(p[0])+" ＋ "+esc(p[1])+'<button data-i="'+i+'" title="移除">×</button></span>'}).join("")||'<div class="mu">目前沒有綁定</div>';
}
$("pairs").onclick=function(e){var i=e.target.getAttribute("data-i");if(i!==null){S.pairs.splice(+i,1);drawPairs();save()}};
$("add").onclick=function(){
  var a=$("a").value,b=$("b").value,m=$("pmsg");m.textContent="";
  if(!a||!b||a===b){m.textContent="請選兩位不同的人";return}
  if(S.pairs.some(function(p){return p.indexOf(a)>=0||p.indexOf(b)>=0})){m.textContent="其中一位已經綁定過了";return}
  S.pairs.push([a,b]);drawPairs();save();
};

function counts(){
  var c={};
  S.rounds.forEach(function(rd){rd.forEach(function(t){
    for(var i=0;i<t.length;i++)for(var j=i+1;j<t.length;j++){var k=[t[i],t[j]].sort().join("|");c[k]=(c[k]||0)+1}
  })});
  return c;
}
function build(M,W,pm,pw,n){
  var bound={};S.pairs.forEach(function(p){bound[p[0]]=bound[p[1]]=1});
  var units=[];
  S.pairs.forEach(function(p){units.push({mem:p,m:p.filter(function(x){return M.indexOf(x)>=0}).length,w:p.filter(function(x){return W.indexOf(x)>=0}).length})});
  M.concat(W).forEach(function(x){if(!bound[x])units.push({mem:[x],m:M.indexOf(x)>=0?1:0,w:W.indexOf(x)>=0?1:0})});
  var c=counts(),best=null,bs=1e9;
  for(var t=0;t<4000&&bs>0;t++){
    var teams=[];for(var i=0;i<n;i++)teams.push({m:0,w:0,mem:[]});
    var ok=true;
    shuffle(units).sort(function(a,b){return(b.m+b.w)-(a.m+a.w)}).forEach(function(u){
      if(!ok)return;
      var f=shuffle(teams).filter(function(x){return x.m+u.m<=pm&&x.w+u.w<=pw});
      if(!f.length){ok=false;return}
      f[0].m+=u.m;f[0].w+=u.w;f[0].mem=f[0].mem.concat(u.mem);
    });
    if(!ok)continue;
    var s=0;
    teams.forEach(function(x){for(var i=0;i<x.mem.length;i++)for(var j=i+1;j<x.mem.length;j++){
      var a=x.mem[i],b=x.mem[j];if(bound[a]&&bound[b]&&S.pairs.some(function(p){return p.indexOf(a)>=0&&p.indexOf(b)>=0}))continue;
      s+=Math.pow(c[[a,b].sort().join("|")]||0,2)*10+(c[[a,b].sort().join("|")]||0)}});
    if(s<bs){bs=s;best=teams}
  }
  return best&&best.map(function(x){return shuffle(x.mem)});
}
$("go").onclick=function(){
  var M=list($("men").value),W=list($("women").value),pm=+$("pm").value||3,pw=+$("pw").value||3;
  var e=$("err");e.textContent="";
  var n=Math.floor(M.length/pm);
  if(n<2||M.length!==n*pm||W.length!==n*pw){e.textContent="人數不符：男生 "+M.length+" 人、女生 "+W.length+" 人，需剛好分成每隊 "+pm+" 男 "+pw+" 女。";return}
  var t=build(M,W,pm,pw,n);
  if(!t){e.textContent="綁定條件讓分隊無解，請減少綁定或調整人數。";return}
  S.rounds.push(t);save();draw();
};
$("clear").onclick=function(){if(S.rounds.length&&confirm("確定清除所有分隊紀錄？")){S.rounds=[];save();draw()}};

function draw(){
  $("info").textContent=S.rounds.length?"已分 "+S.rounds.length+" 輪，系統會盡量避免重複同隊":"";
  var bound={};S.pairs.forEach(function(p){bound[p[0]]=bound[p[1]]=1});
  var Mset=list($("men").value);
  var html="";
  for(var r=S.rounds.length-1;r>=0;r--){
    var rd=S.rounds[r];
    html+='<div class="card"><h2>第 '+(r+1)+' 輪'+(r==S.rounds.length-1?"（最新）":"")+'</h2><div class="teams">';
    rd.forEach(function(t,i){
      html+='<div class="team"><h3>'+NAMES[i%6]+'</h3>'+t.slice().sort(function(a,b){return(Mset.indexOf(a)>=0?0:1)-(Mset.indexOf(b)>=0?0:1)}).map(function(n){
        return'<span class="p '+(Mset.indexOf(n)>=0?"m":"w")+'">'+esc(n)+(bound[n]?" 🔗":"")+'</span>'}).join("")+'</div>';
    });
    html+="</div>";
    if(rd.length==3){
      var N=function(i){return NAMES[i]};
      html+='<div class="vs">賽程：'+N(0)+" vs "+N(1)+"　→　"+N(1)+" vs "+N(2)+"　→　"+N(0)+" vs "+N(2)+"（每隊打兩場）</div>";
    }
    html+="</div>";
  }
  $("out").innerHTML=html;
}

$("men").value=S.men;$("women").value=S.women;
["men","women"].forEach(function(id){$(id).oninput=function(){S[id]=$(id).value;fillSel();save()}});
fillSel();draw();
</script>
</body>
</html>
