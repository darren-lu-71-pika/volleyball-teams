<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>排球自動分隊｜中哥</title>
<style>
:root{--bg:#f3f5f1;--card:#fff;--tx:#183129;--mu:#52665d;--bd:#d9e2da;--ac:#147d5d;--ac-dark:#0b6045;--m:#e0f1ff;--mt:#12486d;--w:#ffe8ed;--wt:#922e4d;--soft:#e8f3ec;--danger:#b72f35}
@media(prefers-color-scheme:dark){:root{--bg:#101d19;--card:#1a2b24;--tx:#f0f7f1;--mu:#b3c5b9;--bd:#365146;--ac:#65d8a4;--ac-dark:#91edc0;--m:#193d50;--mt:#c3e7ff;--w:#4b2939;--wt:#ffd4e2;--soft:#233b2f;--danger:#ff9a9d}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
button,textarea,select,input{font:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #eeb74c;outline-offset:2px}
.shell{max-width:1020px;margin:0 auto;padding:16px 16px max(40px,env(safe-area-inset-bottom))}
.hero{background:linear-gradient(125deg,#124c3c,#0b7053);border-radius:22px;color:#fff;padding:25px 28px;margin-bottom:18px;box-shadow:0 12px 30px #0c503523}
.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:800;text-transform:uppercase;color:#a8ead2;margin:0 0 7px}
h1{font-size:clamp(26px,4vw,36px);line-height:1.2;margin:0 0 6px;letter-spacing:.02em}
.hero p{margin:0;color:#d3f2e5}
.credits{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:17px;padding-top:14px;border-top:1px solid #ffffff47;font-size:14px;font-weight:700;letter-spacing:.03em;color:#fff}
.section{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 4px 16px #17362709}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.step{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--ac-dark);font-weight:800;margin-bottom:2px}
h2{font-size:21px;line-height:1.3;margin:0}
h3{font-size:17px;margin:0}
.muted{color:var(--mu);font-size:14px}
.count-total{background:var(--soft);color:var(--ac-dark);padding:5px 12px;border-radius:999px;font-weight:800;white-space:nowrap}
.roster-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field-label{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-weight:750}
.field-label strong{color:var(--ac-dark)}
textarea,select,input{color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
textarea{display:block;width:100%;min-height:190px;resize:vertical;line-height:1.6;background:var(--bg)}
textarea::placeholder{color:var(--mu)}
select{min-width:0;width:100%}
input[type=number]{width:86px;text-align:center}
.summary{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:15px;padding:12px 14px;border-radius:12px;background:var(--soft);color:var(--tx);font-size:14px}
.summary strong{font-size:16px}
.summary .warning{color:var(--danger);font-weight:700}
.settings{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.setting{display:flex;align-items:center;gap:8px;font-weight:700}
.settings-note{margin:12px 0 0}
details.advanced{border-top:1px solid var(--bd);margin-top:18px;padding-top:14px}
summary{cursor:pointer;font-weight:800;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";font-size:22px;line-height:1;color:var(--ac-dark)}
details[open]>summary::after{content:"−"}
.pair-controls{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:8px;margin-top:14px}
.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--bd);border-radius:99px;padding:3px 5px 3px 12px;margin:9px 7px 0 0;font-size:14px;background:var(--soft)}
.pill button{border:0;background:none;color:var(--mu);padding:0 7px;font-size:20px;line-height:1.3}
button.primary{background:var(--ac);color:#fff;border:0;border-radius:11px;padding:12px 18px;font-weight:800}
button.primary:hover{background:var(--ac-dark)}
@media(prefers-color-scheme:dark){button.primary{color:#0d2820}}
button.secondary{background:var(--card);color:var(--ac-dark);border:1px solid var(--bd);border-radius:10px;padding:9px 14px;font-weight:700}
button.secondary:hover{background:var(--soft)}
.action{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--soft);border:1px solid var(--bd);border-radius:18px;padding:17px 20px;margin-bottom:14px}
.action h2{font-size:18px}
.action .primary{font-size:18px;min-width:180px}
.msg{color:var(--danger);font-size:14px;font-weight:700;margin-top:8px}
.msg:empty{display:none}
.results:empty{display:none}
.result-head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:15px}
.result-head p{margin:4px 0 0}
.teams{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(205px,1fr))}
.team{border:1px solid var(--bd);border-radius:15px;padding:14px;background:var(--bg)}
.team:nth-child(6n+1){border-top:5px solid #d95457}.team:nth-child(6n+2){border-top:5px solid #4386d8}.team:nth-child(6n+3){border-top:5px solid #3da871}.team:nth-child(6n+4){border-top:5px solid #dbaf38}.team:nth-child(6n+5){border-top:5px solid #9665b5}.team:nth-child(6n+6){border-top:5px solid #e38b45}
.team h3{margin-bottom:9px}
.members{display:flex;flex-wrap:wrap;gap:6px}
.person{display:inline-block;border-radius:8px;padding:5px 9px;font-size:15px;font-weight:700}
.person.m{background:var(--m);color:var(--mt)}.person.w{background:var(--w);color:var(--wt)}
.vs{margin-top:15px;padding:11px 13px;border-radius:10px;background:var(--soft);font-size:14px}
.history{margin-bottom:14px}.history>summary{font-size:17px}.history .section{margin:14px 0 0;box-shadow:none}
.manage{color:var(--mu);margin:18px 0}.manage>summary{font-size:14px;font-weight:600}.manage button{color:var(--danger);margin-top:12px}
@media(max-width:620px){.shell{padding:10px 10px max(30px,env(safe-area-inset-bottom))}.hero{padding:22px 19px;border-radius:16px}.section{padding:16px;border-radius:14px}.roster-grid{grid-template-columns:1fr}.pair-controls{grid-template-columns:1fr auto 1fr}.pair-controls button{grid-column:1/-1}.action{align-items:stretch}.action .primary{width:100%}.teams{grid-template-columns:1fr}.credits{gap:3px 12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<main class="shell">
<header class="hero">
  <div class="eyebrow">Volleyball Team Maker</div>
  <h1>🏐 排球自動分隊</h1>
  <p>確認名單，設定每隊人數，按一下就開打。</p>
  <div class="credits"><span>design by 中哥</span><span>power by conquerors71</span></div>
</header>

<section class="section" aria-labelledby="roster-title">
  <div class="section-head"><div><div class="step">Step 01 · 名單</div><h2 id="roster-title">原始名單池</h2></div><div class="count-total" id="totalCount" aria-live="polite">共 0 人</div></div>
  <div class="roster-grid">
    <div><label class="field-label" for="men"><span>男生 · 一行一個名字</span><strong id="menCount">0 人</strong></label><textarea id="men" spellcheck="false" placeholder="輸入男生名字，每行一位"></textarea></div>
    <div><label class="field-label" for="women"><span>女生 · 一行一個名字</span><strong id="womenCount">0 人</strong></label><textarea id="women" spellcheck="false" placeholder="輸入女生名字，每行一位"></textarea></div>
  </div>
  <div class="summary" id="rosterSummary" aria-live="polite"></div>
</section>

<section class="section" aria-labelledby="settings-title">
  <div class="section-head"><div><div class="step">Step 02 · 設定</div><h2 id="settings-title">每隊人數</h2></div></div>
  <div class="settings"><label class="setting" for="pm">男生 <input id="pm" type="number" min="1" value="3" inputmode="numeric"></label><label class="setting" for="pw">女生 <input id="pw" type="number" min="1" value="3" inputmode="numeric"></label></div>
  <p class="muted settings-note">人數需剛好分完，至少兩隊。</p>
  <details class="advanced" id="pairDetails"><summary>綁定同隊 <span class="muted" id="pairCount">0 組</span></summary>
    <p class="muted">需要固定同隊的人，可在這裡綁定。</p>
    <div class="pair-controls"><select id="a" aria-label="第一位隊員"></select><span>＋</span><select id="b" aria-label="第二位隊員"></select><button class="secondary" id="add">綁定</button></div>
    <div id="pairs"></div><div class="msg" id="pmsg" role="alert"></div>
  </details>
</section>

<section class="action" aria-label="開始分隊"><div><div class="step">Step 03 · 開打</div><h2 id="ready">確認人數後開始分隊</h2><div class="muted" id="info"></div><div class="msg" id="err" role="alert"></div></div><button class="primary" id="go">開始分隊 →</button></section>

<div id="out" class="results" aria-live="polite"></div>
<details class="manage"><summary>管理分隊紀錄</summary><button class="secondary" id="clear">清除所有分隊紀錄</button></details>
</main>

<script>
var KEY="vb-teams-v1",NAMES=["紅隊","藍隊","綠隊","黃隊","紫隊","橘隊"];
var $=function(i){return document.getElementById(i)};
var S={men:"",women:"",pm:3,pw:3,pairs:[],rounds:[]},hadSaved=false;
try{var r=localStorage.getItem(KEY);if(r){S=Object.assign(S,JSON.parse(r));hadSaved=true}}catch(e){}
if(!hadSaved){S.men=[1,2,3,4,5,6,7,8,9].map(function(i){return"男"+i}).join("\n");S.women=[1,2,3,4,5,6,7,8,9].map(function(i){return"女"+i}).join("\n")}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function list(t){var seen={};return t.split("\n").map(function(s){return s.trim()}).filter(function(s){if(!s||seen[s])return false;seen[s]=1;return true})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function gender(n){return list($("men").value).indexOf(n)>=0?"m":"w"}

function fillSel(){
  var all=list($("men").value).concat(list($("women").value));
  ["a","b"].forEach(function(id,k){
    var el=$(id),v=el.value;
    el.innerHTML=all.map(function(n){return"<option>"+esc(n)+"</option>"}).join("");
    if(all.indexOf(v)>=0)el.value=v;else if(k==1&&all.length>1)el.value=all[1];
  });
  S.pairs=S.pairs.filter(function(p){return all.indexOf(p[0])>=0&&all.indexOf(p[1])>=0});
  drawPairs();
}
function drawPairs(){
  $("pairs").innerHTML=S.pairs.map(function(p,i){return'<span class="pill">'+esc(p[0])+" ＋ "+esc(p[1])+'<button data-i="'+i+'" aria-label="移除 '+esc(p[0])+' 與 '+esc(p[1])+' 的綁定">×</button></span>'}).join("")||'<div class="muted" style="margin-top:10px">目前沒有綁定</div>';
  $("pairCount").textContent=S.pairs.length+" 組";
}
$("pairs").onclick=function(e){var i=e.target.getAttribute("data-i");if(i!==null){S.pairs.splice(+i,1);drawPairs();save()}};
$("add").onclick=function(){
  var a=$("a").value,b=$("b").value,m=$("pmsg");m.textContent="";
  if(!a||!b||a===b){m.textContent="請選兩位不同的人";return}
  if(S.pairs.some(function(p){return p.indexOf(a)>=0||p.indexOf(b)>=0})){m.textContent="其中一位已經綁定過了";return}
  S.pairs.push([a,b]);drawPairs();save();
};

function counts(){
  var c={};
  S.rounds.forEach(function(rd){rd.forEach(function(t){
    for(var i=0;i<t.length;i++)for(var j=i+1;j<t.length;j++){var k=[t[i],t[j]].sort().join("|");c[k]=(c[k]||0)+1}
  })});
  return c;
}
function build(M,W,pm,pw,n){
  var bound={};S.pairs.forEach(function(p){bound[p[0]]=bound[p[1]]=1});
  var units=[];
  S.pairs.forEach(function(p){units.push({mem:p,m:p.filter(function(x){return M.indexOf(x)>=0}).length,w:p.filter(function(x){return W.indexOf(x)>=0}).length})});
  M.concat(W).forEach(function(x){if(!bound[x])units.push({mem:[x],m:M.indexOf(x)>=0?1:0,w:W.indexOf(x)>=0?1:0})});
  var c=counts(),best=null,bs=1e9;
  for(var t=0;t<4000&&bs>0;t++){
    var teams=[];for(var i=0;i<n;i++)teams.push({m:0,w:0,mem:[]});
    var ok=true;
    shuffle(units).sort(function(a,b){return(b.m+b.w)-(a.m+a.w)}).forEach(function(u){
      if(!ok)return;
      var f=shuffle(teams).filter(function(x){return x.m+u.m<=pm&&x.w+u.w<=pw});
      if(!f.length){ok=false;return}
      f[0].m+=u.m;f[0].w+=u.w;f[0].mem=f[0].mem.concat(u.mem);
    });
    if(!ok)continue;
    var s=0;
    teams.forEach(function(x){for(var i=0;i<x.mem.length;i++)for(var j=i+1;j<x.mem.length;j++){
      var a=x.mem[i],b=x.mem[j];if(bound[a]&&bound[b]&&S.pairs.some(function(p){return p.indexOf(a)>=0&&p.indexOf(b)>=0}))continue;
      s+=Math.pow(c[[a,b].sort().join("|")]||0,2)*10+(c[[a,b].sort().join("|")]||0)}});
    if(s<bs){bs=s;best=teams}
  }
  return best&&best.map(function(x){return shuffle(x.mem)});
}
$("go").onclick=function(){
  var M=list($("men").value),W=list($("women").value),pm=+$("pm").value,pw=+$("pw").value;
  var e=$("err");e.textContent="";
  if(!Number.isInteger(pm)||!Number.isInteger(pw)||pm<1||pw<1){e.textContent="每隊男生與女生都要填入大於 0 的整數。";return}
  if(M.some(function(x){return W.indexOf(x)>=0})){e.textContent="男生與女生名單有相同名字，請先改成能區分的名字。";return}
  var n=Math.floor(M.length/pm);
  if(n<2||M.length!==n*pm||W.length!==n*pw){e.textContent="人數不符：男生 "+M.length+" 人、女生 "+W.length+" 人，需剛好分成每隊 "+pm+" 男 "+pw+" 女。";return}
  var t=build(M,W,pm,pw,n);
  if(!t){e.textContent="綁定條件讓分隊無解，請減少綁定或調整人數。";return}
  S.rounds.push(t);save();draw();$("latest").scrollIntoView({block:"start"});
};
$("clear").onclick=function(){if(S.rounds.length&&confirm("確定清除所有分隊紀錄？")){S.rounds=[];save();draw()}};

function updateRoster(){
  var M=list($("men").value),W=list($("women").value),pm=+$("pm").value,pw=+$("pw").value;
  var overlap=M.filter(function(x){return W.indexOf(x)>=0});
  var duplicates=function(raw){var names=raw.split("\n").map(function(x){return x.trim()}).filter(Boolean);return names.length-list(raw).length};
  var repeated=duplicates($("men").value)+duplicates($("women").value);
  $("menCount").textContent=M.length+" 人";$("womenCount").textContent=W.length+" 人";
  $("totalCount").textContent="共 "+(M.length+W.length)+" 人";
  var note="男 "+M.length+" 人 · 女 "+W.length+" 人";
  if(overlap.length)note+=' <span class="warning">⚠ 男女名單有 '+overlap.length+' 個同名，請區分</span>';
  if(repeated)note+=' <span class="warning">⚠ 重複輸入 '+repeated+' 筆，統計未重複計入</span>';
  $("rosterSummary").innerHTML="<strong>名單核對</strong>"+note;
  var ready=Number.isInteger(pm)&&Number.isInteger(pw)&&pm>0&&pw>0&&!overlap.length&&M.length>=pm*2&&M.length%pm===0&&W.length===M.length/pm*pw;
  $("ready").textContent=ready?"可分成 "+(M.length/pm)+" 隊，每隊 "+pm+" 男 "+pw+" 女":"確認人數後開始分隊";
}
function roundHTML(rd,r,latest,Mset,bound){
  var html='<section class="section"'+(latest?' id="latest"':'')+'><div class="result-head"><div><div class="step">'+(latest?'最新結果':'分隊紀錄')+'</div><h2>第 '+(r+1)+' 輪 · '+rd.length+' 隊</h2></div>';
  if(latest)html+='<button class="secondary" id="copy" type="button">複製結果</button>';
  html+='</div><div class="teams">';
  rd.forEach(function(t,i){
    html+='<div class="team"><h3>'+NAMES[i%6]+' · '+t.length+' 人</h3><div class="members">'+t.slice().sort(function(a,b){return(Mset.indexOf(a)>=0?0:1)-(Mset.indexOf(b)>=0?0:1)}).map(function(n){return'<span class="person '+(Mset.indexOf(n)>=0?'m':'w')+'">'+esc(n)+(bound[n]?' 🔗':'')+'</span>'}).join("")+'</div></div>';
  });
  html+='</div>';
  if(rd.length===3)html+='<div class="vs"><strong>三隊賽程：</strong>'+NAMES[0]+' vs '+NAMES[1]+' → '+NAMES[1]+' vs '+NAMES[2]+' → '+NAMES[0]+' vs '+NAMES[2]+'（每隊兩場）</div>';
  if(latest)html+='<div class="muted" id="copyMsg" role="status" style="margin-top:9px"></div>';
  return html+'</section>';
}
function draw(){
  $("info").textContent=S.rounds.length?"已分 "+S.rounds.length+" 輪；系統會盡量避免重複同隊":"歷史紀錄會自動保存在這台裝置";
  var bound={};S.pairs.forEach(function(p){bound[p[0]]=bound[p[1]]=1});
  var Mset=list($("men").value);
  var html="",last=S.rounds.length-1;
  if(last>=0){
    html=roundHTML(S.rounds[last],last,true,Mset,bound);
    if(last>0){
      html+='<details class="section history"><summary>先前輪次 <span class="muted">共 '+last+' 輪</span></summary>';
      for(var r=last-1;r>=0;r--)html+=roundHTML(S.rounds[r],r,false,Mset,bound);
      html+='</details>';
    }
  }
  $("out").innerHTML=html;
}

$("out").onclick=function(e){if(e.target.id!=="copy")return;
  var rd=S.rounds[S.rounds.length-1];if(!rd)return;
  var value="🏐 排球自動分隊｜第 "+S.rounds.length+" 輪\n"+rd.map(function(t,i){return NAMES[i%6]+"："+t.join("、")}).join("\n");
  if(rd.length===3)value+="\n賽程：紅隊 vs 藍隊 → 藍隊 vs 綠隊 → 紅隊 vs 綠隊";
  function done(ok){$("copyMsg").textContent=ok?"已複製，可貼到群組。":"無法自動複製，請選取隊伍內容手動複製。"}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(value).then(function(){done(true)},function(){done(false)});
  else{var el=document.createElement("textarea");el.value=value;document.body.appendChild(el);el.select();try{done(document.execCommand("copy"))}catch(err){done(false)}el.remove()}
};
$("men").value=S.men;$("women").value=S.women;$("pm").value=S.pm;$("pw").value=S.pw;
["men","women"].forEach(function(id){$(id).oninput=function(){S[id]=$(id).value;fillSel();updateRoster();save()}});
["pm","pw"].forEach(function(id){$(id).oninput=function(){S[id]=+$(id).value;updateRoster();save()}});
fillSel();updateRoster();draw();
</script>
</body>
</html>
